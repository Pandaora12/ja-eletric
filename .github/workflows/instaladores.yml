name: Gerar instaladores

# Roda quando alguém clica em "Run workflow" na aba Actions.
on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  instalador:
    strategy:
      fail-fast: false
      matrix:
        include:
          - plataforma: windows-latest
            nome: windows
          - plataforma: macos-latest
            nome: mac
    runs-on: ${{ matrix.plataforma }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - uses: dtolnay/rust-toolchain@stable

      - uses: swatinem/rust-cache@v2
        with:
          workspaces: src-tauri

      - name: Instalar dependências
        run: npm ci

      - name: Gerar instalador
        env:
          VITE_SUPABASE_URL: ${{ secrets.VITE_SUPABASE_URL }}
          VITE_SUPABASE_ANON_KEY: ${{ secrets.VITE_SUPABASE_ANON_KEY }}
        run: npm run tauri build

      - name: Guardar instalador
        uses: actions/upload-artifact@v4
        with:
          name: J.A-Documentos-${{ matrix.nome }}
          path: |
            src-tauri/target/release/bundle/msi/*.msi
            src-tauri/target/release/bundle/nsis/*.exe
            src-tauri/target/release/bundle/dmg/*.dmg
          if-no-files-found: warn
