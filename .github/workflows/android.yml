name: App Android (APK)

# Gera o APK sempre que este ramo recebe um envio, ou quando alguém clica em "Run workflow".
on:
  push:
    branches: [ccr-fe682316-l4aggd]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  apk:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - name: Preparar Android (já vem instalado no computador do GitHub)
        run: |
          echo "ANDROID_HOME=$ANDROID_HOME" 
          NDK="${ANDROID_NDK_LATEST_HOME:-}"
          if [ -z "$NDK" ] || [ ! -d "$NDK" ]; then
            yes | "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" --install "ndk;27.0.12077973" > /dev/null
            NDK="$ANDROID_HOME/ndk/27.0.12077973"
          fi
          echo "NDK_HOME=$NDK" >> $GITHUB_ENV
          echo "ANDROID_SDK_ROOT=$ANDROID_HOME" >> $GITHUB_ENV
          ls "$NDK" | head -3

      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: aarch64-linux-android,armv7-linux-androideabi,x86_64-linux-android,i686-linux-android

      - uses: swatinem/rust-cache@v2
        with:
          workspaces: src-tauri

      - name: Instalar dependências
        run: npm ci

      - name: Preparar projeto Android
        run: npx tauri android init --ci

      - name: Gerar APK
        run: npx tauri android build --apk --debug

      - name: Guardar APK
        uses: actions/upload-artifact@v4
        with:
          name: J.A-Documentos-Android
          path: src-tauri/gen/android/app/build/outputs/apk/**/*.apk
          if-no-files-found: error
