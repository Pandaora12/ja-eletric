plugins {
    id 'com.android.application'
}

android {
    namespace 'br.pdfleitor.app'
    compileSdk 34

    defaultConfig {
        applicationId "br.pdfleitor.app"
        minSdk 21
        targetSdk 34
        versionCode 1
        versionName "1.0"
    }

    signingConfigs {
        // mesma chave usada pelo build-apk.sh, para permitir atualizar o app instalado
        pdfleitor {
            storeFile rootProject.file('keystore/debug.keystore')
            storePassword 'android'
            keyAlias 'pdfleitor'
            keyPassword 'android'
        }
    }

    buildTypes {
        debug {
            signingConfig signingConfigs.pdfleitor
        }
        release {
            minifyEnabled true
            shrinkResources true
            proguardFiles getDefaultProguardFile('proguard-android-optimize.txt')
            signingConfig signingConfigs.pdfleitor
        }
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_1_8
        targetCompatibility JavaVersion.VERSION_1_8
    }

    lint {
        abortOnError false
    }
}

// Sem dependências externas: o app usa apenas o framework do Android.
